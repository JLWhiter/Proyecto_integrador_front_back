spring.application.name=techzone-backend
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:TECHZONE_SESSION}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/proyecto?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# never: el script database/script_mysql.sql se ejecuta a mano en el gestor.
# Si se dejara en "always", Spring volveria a correr los INSERT en cada arranque
# y fallaria con "Duplicate entry" en las claves primarias.
spring.sql.init.mode=never

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

# API Peru (consulta DNI/RUC). La clave se configura solamente en el backend.
app.apiperu.base-url=${APIPERU_BASE_URL:https://api.apiperu.pe}
app.apiperu.token=${APIPERU_TOKEN:}
app.apiperu.timeout-seconds=${APIPERU_TIMEOUT_SECONDS:8}
